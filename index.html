<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Booking Cloud System V4.2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --danger: #e74c3c; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; }
        .navbar { background: var(--primary); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .container { width: 95%; max-width: 1200px; margin: 20px auto; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: #f4f4f4; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--secondary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

    <nav class="navbar">
        <strong>E-BOOKING CLOUD V4.2</strong>
        <div>
            <button onclick="location.reload()" class="btn btn-primary">🏠 Beranda</button>
            <button onclick="openModal('section-login')" class="btn btn-primary">🔐 Login</button>
        </div>
    </nav>

    <div class="container">
        <!-- FORM UTAMA -->
        <div id="section-user" class="card">
            <h2 id="form-title">Formulir Reservasi</h2>
            <input type="hidden" id="edit_row_id">
            <input type="text" id="u_nama" placeholder="Nama Peminjam">
            <input type="text" id="u_instansi" placeholder="Nama Instansi">
            <input type="text" id="u_acara" placeholder="Nama Acara">
            <select id="u_lokasi"><option value="Aula">Aula</option><option value="Ruang Pertemuan">Ruang Pertemuan</option></select>
            <input type="text" id="u_tanggal" placeholder="Pilih Tanggal">
            <button id="btn-save" class="btn btn-success" style="width:100%;" onclick="simpanBooking()">Kirim Reservasi</button>
            <button id="btn-cancel-edit" class="btn btn-danger" style="width:100%; margin-top:5px; display:none;" onclick="cancelEdit()">Batal Edit</button>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="section-admin" style="display:none;">
            <div class="card">
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:20px;">
                    <h2>Admin Dashboard</h2>
                    <div>
                        <button class="btn btn-primary" onclick="exportCSV()">📥 Export Excel</button>
                        <button class="btn btn-danger" onclick="location.reload()">Logout</button>
                    </div>
                </div>
                <table>
                    <thead><tr><th>Nama</th><th>Instansi</th><th>Acara</th><th>Lokasi</th><th>Jadwal</th><th>Aksi</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- MODAL LOGIN -->
        <div id="section-login" class="modal">
            <div class="card" style="width:320px;">
                <h3 style="text-align:center;">Login Admin</h3>
                <input type="text" id="l_user" placeholder="Username">
                <input type="password" id="l_pass" placeholder="Password">
                <button class="btn btn-success" style="width:100%;" onclick="doLogin()">Masuk</button>
                <button class="btn btn-danger" style="width:100%; margin-top:5px;" onclick="closeAll()">Batal</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP BARU ANDA!
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzi5s7Y9w_YWScceCNlyabW84rX1ZeYI_lM_qbaMbBYNJKm6TgxlJi8UaxwwRWowU6-gA/exec';
        let currentData = [];
        let admin = JSON.parse(localStorage.getItem('db_admin')) || {u:"superadmin", p:"admin2026"};

        flatpickr("#u_tanggal", { mode: "range" });

        async function simpanBooking() {
            const rowId = document.getElementById('edit_row_id').value;
            const data = {
                action: rowId ? "edit" : "add",
                row: rowId,
                nama: document.getElementById('u_nama').value,
                instansi: document.getElementById('u_instansi').value,
                acara: document.getElementById('u_acara').value,
                lokasi: document.getElementById('u_lokasi').value,
                tgl: document.getElementById('u_tanggal').value
            };

            if(!data.nama || !data.tgl) return alert("Nama dan Tanggal wajib diisi!");

            document.getElementById('btn-save').innerText = "Memproses...";
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            
            alert(rowId ? "Data Berhasil Diupdate!" : "Data Berhasil Disimpan!");
            location.reload();
        }

        async function renderTable() {
            const b = document.getElementById('table-body');
            b.innerHTML = "<tr><td colspan='6'>Sinkronisasi data...</td></tr>";
            const resp = await fetch(scriptURL);
            currentData = await resp.json();
            b.innerHTML = "";
            currentData.reverse().forEach((x, i) => {
                const realIndex = currentData.length - i;
                b.innerHTML += `<tr>
                    <td>${x.nama}</td><td>${x.instansi}</td><td>${x.acara}</td><td>${x.lokasi}</td><td>${x.tgl}</td>
                    <td>
                        <button class="btn btn-primary" onclick="prepareEdit(${realIndex}, '${x.nama}', '${x.instansi}', '${x.acara}', '${x.lokasi}', '${x.tgl}')">Edit</button>
                        <button class="btn btn-danger" onclick="hapusData(${realIndex})">Hapus</button>
                    </td>
                </tr>`;
            });
        }

        function prepareEdit(id, n, i, a, l, t) {
            document.getElementById('edit_row_id').value = id + 1; // +1 karena header
            document.getElementById('u_nama').value = n;
            document.getElementById('u_instansi').value = i;
            document.getElementById('u_acara').value = a;
            document.getElementById('u_lokasi').value = l;
            document.getElementById('u_tanggal').value = t;
            document.getElementById('form-title').innerText = "Mode Edit Data (Baris " + id + ")";
            document.getElementById('btn-save').innerText = "Simpan Perubahan";
            document.getElementById('btn-cancel-edit').style.display = "block";
            window.scrollTo(0,0);
        }

        function cancelEdit() { location.reload(); }

        async function hapusData(id) {
            if(confirm("Hapus baris " + id + "?")) {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action: "delete", row: id + 1}) });
                alert("Terhapus!");
                renderTable();
            }
        }

        function exportCSV() {
            let csv = "Nama,Instansi,Acara,Lokasi,Jadwal\n";
            currentData.forEach(r => { csv += `${r.nama},${r.instansi},${r.acara},${r.lokasi},${r.tgl}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Data_Booking.csv');
            a.click();
        }

        function doLogin() {
            if(document.getElementById('l_user').value === admin.u && document.getElementById('l_pass').value === admin.p) {
                closeAll();
                document.getElementById('section-admin').style.display = 'block';
                renderTable();
            } else alert("Salah!");
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeAll() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
    </script>
</body>
</html>
